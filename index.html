<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shifts</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">

<!-- iOS home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shifts">
<link rel="apple-touch-icon" href="icon.svg">

<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root {
  --bg:          #0a0e1a;
  --surface:     #111827;
  --surface-2:   #172033;
  --surface-3:   #1e2c42;
  --border:      rgba(255,255,255,0.06);
  --border-2:    rgba(255,255,255,0.11);
  --accent:      #38bdf8;
  --accent-dim:  rgba(56,189,248,0.10);
  --done:        #4ade80;
  --done-dim:    rgba(74,222,128,0.09);
  --amber:       #fbbf24;
  --amber-dim:   rgba(251,191,36,0.12);
  --danger:      #f87171;
  --danger-dim:  rgba(248,113,113,0.10);
  --text-1:      #e2e8f0;
  --text-2:      #7c8fa6;
  --text-3:      #3d5068;
  --radius:      18px;
  --radius-sm:   12px;
  --font:        'Outfit', system-ui, sans-serif;
}

html {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-1);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100dvh;
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px calc(96px + env(safe-area-inset-bottom));
  position: relative;
}

/* ---- HEADER ---- */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: 20px 0 0;
  background: linear-gradient(to bottom, var(--bg) 82%, transparent);
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}

.brand-name {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Small icon buttons in header */
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border-2);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.12s;
  flex-shrink: 0;
}
.icon-btn:hover  { background: var(--surface-2); color: var(--text-1); }
.icon-btn:active { transform: scale(0.88); }

/* Lock button: amber when unlocked to signal "edit mode is on" */
.icon-btn.unlocked {
  color: var(--amber);
  border-color: rgba(251,191,36,0.3);
  background: var(--amber-dim);
}

/* Calc button: accent when active */
.icon-btn.selecting {
  color: var(--accent);
  border-color: rgba(56,189,248,0.3);
  background: var(--accent-dim);
}

/* Unlock banner */
.unlock-banner {
  display: none;
  align-items: center;
  gap: 8px;
  background: var(--amber-dim);
  border: 1px solid rgba(251,191,36,0.2);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  margin-bottom: 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--amber);
}
.unlock-banner.visible { display: flex; }

.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.month-display { flex: 1; text-align: center; }

.month-label {
  font-size: 26px;
  font-weight: 800;
  color: var(--text-1);
  letter-spacing: -0.5px;
  line-height: 1;
}

.nav-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border-2);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.18s, color 0.18s, transform 0.12s;
  flex-shrink: 0;
}
.nav-btn:hover  { background: var(--surface-2); color: var(--text-1); }
.nav-btn:active { transform: scale(0.92); }

/* Progress bar */
.progress-track {
  height: 3px;
  background: var(--surface-3);
  border-radius: 2px;
  margin-bottom: 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--done));
  border-radius: 2px;
  transition: width 0.4s cubic-bezier(0.16,1,0.3,1);
}

/* Stats */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}

.stats-row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 10px;
  text-align: center;
}

.stat-value {
  font-size: 24px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 5px;
  letter-spacing: -0.5px;
}
.stat-value.accent { color: var(--accent); }
.stat-value.done   { color: var(--done);   }
.stat-value.amber  { color: var(--amber);  }
.stat-value.plain  { color: var(--text-1); }

.stat-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.10em;
  color: var(--text-3);
}

/* ---- ENTRY LIST ---- */
.entry-list { display: flex; flex-direction: column; gap: 6px; }

/* ---- FREE DAY ---- */
.free-day {
  display: grid;
  grid-template-columns: 58px 1fr;
  gap: 12px;
  align-items: center;
  padding: 10px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: transparent;
  transition: background 0.15s, border-color 0.15s;
  cursor: default;
}

.free-day.clickable { cursor: pointer; }
.free-day.clickable:hover {
  background: var(--surface);
  border-color: var(--border-2);
}
.free-day.clickable:active { transform: scale(0.995); }

.free-day .date-bubble {
  height: 50px;
  background: transparent;
  border-color: var(--border);
}

.free-day .date-num { font-size: 20px; color: var(--text-3); }
.free-day .date-wd  { color: var(--text-3); opacity: 0.6; }

.free-day.is-today .date-bubble {
  background: var(--accent-dim);
  border-color: rgba(56,189,248,0.25);
}
.free-day.is-today .date-num { color: var(--accent); }

.free-day.is-weekend .date-num { color: var(--text-2); }
.free-day.is-weekend .date-wd  { opacity: 0.8; }

.free-day.past .date-num { opacity: 0.45; }
.free-day.past .date-wd  { opacity: 0.3; }

.free-content { display: flex; align-items: center; justify-content: space-between; }

.free-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-3);
}

.free-day.is-today .free-label { color: var(--accent); font-weight: 600; }
.free-day.is-weekend .free-label { color: var(--text-2); }
.free-day.past .free-label { opacity: 0.45; }

.free-add-hint {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.05em;
  opacity: 0;
  transition: opacity 0.15s;
}
.free-day.clickable:hover .free-add-hint { opacity: 1; }

/* ---- ENTRY CARD ---- */
.entry-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: grid;
  grid-template-columns: 58px 1fr 44px;
  gap: 12px;
  align-items: center;
  position: relative;
  transition: background 0.18s, border-color 0.18s, transform 0.12s;
  animation: cardIn 0.22s ease both;
  /* Locked by default: not interactive */
  cursor: default;
  user-select: none;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Editable state (unlocked) */
.entry-card.editable {
  cursor: pointer;
}
.entry-card.editable:hover {
  background: var(--surface-2);
  border-color: var(--border-2);
}
.entry-card.editable:active { transform: scale(0.99); }

/* Selectable state (calc mode) */
.entry-card.selectable { cursor: pointer; }
.entry-card.selectable:hover { background: var(--surface-2); border-color: var(--border-2); }
.entry-card.selectable:active { transform: scale(0.99); }

.entry-card.card-selected {
  border-color: rgba(56,189,248,0.35);
  background: rgba(56,189,248,0.06);
}

.entry-card.completed {
  border-color: rgba(74,222,128,0.13);
  background: rgba(74,222,128,0.03);
}
.entry-card.card-selected.completed {
  border-color: rgba(56,189,248,0.35);
  background: rgba(56,189,248,0.07);
}

.entry-card.is-today {
  border-color: rgba(56,189,248,0.22);
  background: rgba(56,189,248,0.04);
}

@media (prefers-reduced-motion: reduce) {
  .entry-card  { animation: none; }
  .progress-fill { transition: none; }
}

/* Date bubble */
.date-bubble {
  width: 58px;
  height: 64px;
  border-radius: 12px;
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, border-color 0.2s;
  flex-shrink: 0;
  position: relative;
}

.entry-card.completed .date-bubble {
  background: var(--done-dim);
  border-color: rgba(74,222,128,0.18);
}
.entry-card.is-today .date-bubble {
  background: var(--accent-dim);
  border-color: rgba(56,189,248,0.25);
}
.entry-card.card-selected .date-bubble {
  background: var(--accent-dim);
  border-color: rgba(56,189,248,0.4);
}

/* Selection tick overlay on date bubble */
.select-tick {
  display: none;
  position: absolute;
  inset: 0;
  border-radius: 11px;
  background: rgba(56,189,248,0.15);
  align-items: center;
  justify-content: center;
}
.entry-card.card-selected .select-tick { display: flex; }

.date-num {
  font-size: 24px;
  font-weight: 800;
  line-height: 1;
  color: var(--text-1);
  letter-spacing: -0.5px;
}
.entry-card.completed .date-num  { color: var(--done); }
.entry-card.is-today  .date-num  { color: var(--accent); }
.entry-card.card-selected .date-num { color: var(--accent); }

.date-wd {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-3);
  margin-top: 3px;
}
.entry-card.completed .date-wd   { color: rgba(74,222,128,0.45); }
.entry-card.is-today  .date-wd   { color: rgba(56,189,248,0.55); }
.entry-card.card-selected .date-wd { color: rgba(56,189,248,0.6); }

/* Entry body */
.entry-body { min-width: 0; }

.entry-company {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
  margin-bottom: 3px;
}
.entry-card.completed .entry-company { color: var(--text-2); }

.entry-role {
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.entry-card.completed .entry-role { color: var(--text-3); }

.entry-meta {
  display: flex;
  align-items: center;
  gap: 4px;
}

.entry-address {
  font-size: 11.5px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

/* Earnings row on card */
.entry-earn {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 5px;
}
.earn-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  background: var(--surface-3);
  border-radius: 6px;
  padding: 2px 7px;
}
.earn-chip.earn-total {
  color: var(--done);
  background: var(--done-dim);
}

/* Check / select button */
.check-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.8px solid var(--border-2);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.18s, border-color 0.18s, transform 0.12s;
  color: var(--text-3);
  flex-shrink: 0;
  align-self: center;
}
.check-btn:hover  { border-color: var(--done); color: var(--done); background: var(--done-dim); }
.check-btn:active { transform: scale(0.88); }
.entry-card.completed .check-btn {
  border-color: var(--done);
  color: var(--done);
  background: var(--done-dim);
}

/* Today pill */
.today-pill {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.10em;
  background: var(--accent);
  color: #0a0e1a;
  border-radius: 4px;
  padding: 2px 5px;
  margin-left: 6px;
  vertical-align: middle;
  line-height: 1.4;
}

/* ---- FAB ---- */
.fab {
  position: fixed;
  right: max(24px, calc(50% - 320px + 24px));
  bottom: calc(28px + env(safe-area-inset-bottom));
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 28px rgba(56,189,248,0.38);
  transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
  z-index: 100;
}
.fab:hover  { transform: scale(1.07); box-shadow: 0 10px 36px rgba(56,189,248,0.50); }
.fab:active { transform: scale(0.93); }
.fab.hidden { opacity: 0; pointer-events: none; transform: scale(0.8); }

/* ---- CALC BAR (selection mode bottom bar) ---- */
.calc-bar {
  position: fixed;
  left: 0; right: 0;
  bottom: 0;
  z-index: 110;
  background: var(--surface-2);
  border-top: 1px solid var(--border-2);
  padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 12px;
  transform: translateY(110%);
  transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
  max-width: 640px;
  margin: 0 auto;
}
.calc-bar.open { transform: translateY(0); }

.calc-bar-info { flex: 1; min-width: 0; }
.calc-bar-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.10em;
  color: var(--text-3);
  margin-bottom: 4px;
}
.calc-bar-total {
  font-size: 26px;
  font-weight: 800;
  color: var(--done);
  letter-spacing: -0.5px;
  line-height: 1;
}
.calc-bar-sub {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 3px;
}
.calc-bar-cancel {
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-2);
  background: var(--surface-3);
  color: var(--text-2);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
  transition: color 0.15s, background 0.15s;
}
.calc-bar-cancel:hover { color: var(--text-1); }
.calc-bar-cancel:active { transform: scale(0.96); }

/* ---- MODAL ---- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
}
.overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 24px 24px 0 0;
  padding: 12px 20px calc(32px + env(safe-area-inset-bottom));
  width: 100%;
  max-width: 640px;
  max-height: 90dvh;
  overflow-y: auto;
  transform: translateY(110%);
  transition: transform 0.32s cubic-bezier(0.16,1,0.3,1);
  overscroll-behavior: contain;
}
.overlay.open .modal { transform: translateY(0); }

.modal-handle {
  width: 40px;
  height: 4px;
  background: var(--border-2);
  border-radius: 2px;
  margin: 0 auto 20px;
}

.modal-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text-1);
  letter-spacing: -0.3px;
  margin-bottom: 22px;
}

/* Form */
.form-group { margin-bottom: 14px; }

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.10em;
  color: var(--text-3);
  margin-bottom: 7px;
}

.form-input {
  width: 100%;
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 500;
  color: var(--text-1);
  outline: none;
  transition: border-color 0.18s;
  -webkit-appearance: none;
  appearance: none;
}
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--text-3); }

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(0.5); cursor: pointer;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { opacity: 0.4; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* Earn preview in modal */
.earn-preview {
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.earn-preview-label { font-size: 12px; color: var(--text-3); font-weight: 600; }
.earn-preview-value { font-size: 20px; font-weight: 800; color: var(--done); letter-spacing: -0.3px; }

.modal-actions { display: flex; gap: 10px; margin-top: 20px; }

.btn {
  flex: 1;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  border: none;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.12s;
}
.btn:active { transform: scale(0.97); }

.btn-primary { background: var(--accent); color: #0a0e1a; }
.btn-primary:hover { opacity: 0.88; }

.btn-ghost {
  background: var(--surface-3);
  color: var(--text-2);
  border: 1px solid var(--border-2);
}
.btn-ghost:hover { color: var(--text-1); opacity: 0.85; }

.btn-danger {
  width: 100%;
  margin-top: 10px;
  background: var(--danger-dim);
  color: var(--danger);
  border: 1px solid rgba(248,113,113,0.18);
  flex: none;
}
.btn-danger:hover { background: rgba(248,113,113,0.16); }

/* Scroll */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }

/* ---- RESPONSIVE ---- */
@media (max-width: 420px) {
  body { padding: 0 12px calc(90px + env(safe-area-inset-bottom)); }
  .month-label { font-size: 22px; }
  .stat-value  { font-size: 20px; }
  .modal       { padding: 12px 14px calc(28px + env(safe-area-inset-bottom)); }
  .entry-card  { grid-template-columns: 52px 1fr 40px; gap: 10px; padding: 12px; }
  .date-bubble { width: 52px; height: 58px; }
  .date-num    { font-size: 21px; }
  .form-row    { grid-template-columns: 1fr; }
  .free-day    { grid-template-columns: 52px 1fr; padding: 10px 12px; }
  .free-day .date-bubble { width: 52px; }
  .free-day .date-num    { font-size: 18px; }
}

@media (min-width: 641px) {
  .fab { right: calc(50% - 320px + 24px); }
  .calc-bar { left: calc(50% - 320px); right: calc(50% - 320px); }
}
</style>
</head>
<body>

<!-- ======= HEADER ======= -->
<div class="app-header">
  <div class="brand-row">
    <span class="brand-name">Shifts</span>
    <div class="header-actions">
      <!-- Calc / select button -->
      <button class="icon-btn" id="calcBtn" aria-label="Select shifts to calculate" title="Select shifts to calculate">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="5" height="4" rx="1.2" fill="currentColor" opacity=".7"/>
          <rect x="9" y="2" width="5" height="4" rx="1.2" fill="currentColor" opacity=".7"/>
          <rect x="2" y="10" width="5" height="4" rx="1.2" fill="currentColor" opacity=".7"/>
          <rect x="9" y="10" width="5" height="4" rx="1.2" fill="currentColor" opacity=".7"/>
        </svg>
      </button>
      <!-- Lock / unlock button -->
      <button class="icon-btn" id="lockBtn" aria-label="Unlock to edit" title="Unlock to edit">
        <!-- Locked padlock (default) -->
        <svg id="lockIcon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="4" y="7" width="8" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <!-- Open padlock (unlocked) -->
        <svg id="unlockIcon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="display:none">
          <rect x="4" y="7" width="8" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Unlock banner -->
  <div class="unlock-banner" id="unlockBanner" aria-live="polite">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="4" y="7" width="8" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
      <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    Edit mode on - tap a shift to change it
  </div>

  <div class="month-nav">
    <button class="nav-btn" id="prevBtn" aria-label="Previous month">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 12.5L5.5 8 10 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="month-display">
      <div class="month-label" id="monthLabel"></div>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="Next month">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <!-- Stats row 1 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value accent" id="statTotal">0</div>
      <div class="stat-label">Shifts</div>
    </div>
    <div class="stat-card">
      <div class="stat-value done" id="statDone">0</div>
      <div class="stat-label">Done</div>
    </div>
    <div class="stat-card">
      <div class="stat-value plain" id="statLeft">0</div>
      <div class="stat-label">Upcoming</div>
    </div>
  </div>

  <!-- Stats row 2: hours + earnings -->
  <div class="stats-row-2">
    <div class="stat-card">
      <div class="stat-value plain" id="statHours">0h</div>
      <div class="stat-label">Month Hours</div>
    </div>
    <div class="stat-card">
      <div class="stat-value amber" id="statEarned">€0</div>
      <div class="stat-label">Month Earned</div>
    </div>
  </div>
</div>

<!-- ======= ENTRY LIST ======= -->
<div class="entry-list" id="entryList" role="list"></div>

<!-- ======= FAB ======= -->
<button class="fab hidden" id="fabBtn" aria-label="Add a shift">
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
    <path d="M11 3v16M3 11h16" stroke="#0a0e1a" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
</button>

<!-- ======= CALC BAR ======= -->
<div class="calc-bar" id="calcBar" role="status" aria-live="polite">
  <div class="calc-bar-info">
    <div class="calc-bar-label" id="calcBarLabel">0 shifts selected</div>
    <div class="calc-bar-total" id="calcBarTotal">€0.00</div>
    <div class="calc-bar-sub" id="calcBarSub">0h total</div>
  </div>
  <button class="calc-bar-cancel" id="calcCancelBtn">Done</button>
</div>

<!-- ======= MODAL ======= -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modal">
    <div class="modal-handle" aria-hidden="true"></div>
    <div class="modal-title" id="modalTitle">Add Shift</div>

    <form id="shiftForm" novalidate autocomplete="off">

      <div class="form-group">
        <label class="form-label" for="fDate">Date</label>
        <input class="form-input" type="date" id="fDate" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="fCompany">Company</label>
        <input class="form-input" type="text" id="fCompany" placeholder="Company or employer name" maxlength="80" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="fRole">Position / Role</label>
        <input class="form-input" type="text" id="fRole" placeholder="Your role or job title" maxlength="60">
      </div>

      <div class="form-group">
        <label class="form-label" for="fAddress">Location / Address</label>
        <input class="form-input" type="text" id="fAddress" placeholder="Work site address" maxlength="100">
      </div>

      <!-- Hours + Rate -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="fHours">Hours Worked</label>
          <input class="form-input" type="number" id="fHours" placeholder="0" min="0" max="24" step="0.5">
        </div>
        <div class="form-group">
          <label class="form-label" for="fRate">Rate (€/hr)</label>
          <input class="form-input" type="number" id="fRate" placeholder="0.00" min="0" step="0.01">
        </div>
      </div>

      <!-- Live earn preview -->
      <div class="earn-preview" id="earnPreview" style="display:none">
        <span class="earn-preview-label">Shift earnings</span>
        <span class="earn-preview-value" id="earnPreviewVal">€0.00</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="fNotes">Notes</label>
        <input class="form-input" type="text" id="fNotes" placeholder="Optional notes" maxlength="120">
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save Shift</button>
      </div>

      <div id="deleteRow" hidden>
        <button type="button" class="btn btn-danger" id="deleteBtn">Remove this Shift</button>
      </div>

    </form>
  </div>
</div>

<!-- ======= SCRIPT ======= -->
<script>
'use strict';

// ---- Constants ----
const STORAGE_KEY = 'shifts-data-v1';
const WEEKDAYS    = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS      = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];

// ---- State ----
let currentYM   = todayYM();
let editingId   = null;
let isLocked    = true;
let isSelecting = false;
let selectedIds = new Set();

// ---- Helpers ----
function todayStr() { return new Date().toISOString().slice(0, 10); }
function todayYM()  { return todayStr().slice(0, 7); }

function ymLabel(ym) {
  const parts = (ym || '').split('-');
  const y = Number(parts[0]);
  const m = Number(parts[1]);
  const name = MONTHS[m - 1];
  return (name && y) ? name + ' ' + y : 'Invalid Date';
}

function shiftYM(ym, delta) {
  let [y, m] = ym.split('-').map(Number);
  m += delta;
  if (m > 12) { m = 1;  y++; }
  if (m <  1) { m = 12; y--; }
  return y + '-' + String(m).padStart(2, '0');
}

function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

function getDaysInMonth(ym) {
  const [y, m] = ym.split('-').map(Number);
  const count  = new Date(y, m, 0).getDate();
  const days   = [];
  for (let d = 1; d <= count; d++) {
    days.push(ym + '-' + String(d).padStart(2, '0'));
  }
  return days;
}
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtEur(n) {
  return '€' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function fmtHours(h) {
  return h % 1 === 0 ? h + 'h' : h + 'h';
}

function entryEarnings(entry) {
  const h = parseFloat(entry.hours) || 0;
  const r = parseFloat(entry.rate)  || 0;
  return h * r;
}

// ---- Storage ----
function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function save(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

// ---- Render ----
function render() {
  const all      = load();
  const filtered = all.filter(e => e.date.startsWith(currentYM))
                      .sort((a, b) => a.date.localeCompare(b.date));
  const today    = todayStr();

  // Header
  document.getElementById('monthLabel').textContent = ymLabel(currentYM);

  // Stats row 1
  const total = filtered.length;
  const done  = filtered.filter(e => e.completed).length;
  const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent  = done;
  document.getElementById('statLeft').textContent  = total - done;
  document.getElementById('progressFill').style.width = pct + '%';

  // Stats row 2
  const totalHours   = filtered.reduce((s, e) => s + (parseFloat(e.hours) || 0), 0);
  const totalEarned  = filtered.reduce((s, e) => s + entryEarnings(e), 0);
  document.getElementById('statHours').textContent  = totalHours > 0 ? fmtHours(totalHours) : '0h';
  document.getElementById('statEarned').textContent = totalEarned > 0 ? fmtEur(totalEarned) : '€0';

  // FAB: only show when unlocked and not in select mode
  const fab = document.getElementById('fabBtn');
  fab.classList.toggle('hidden', isLocked || isSelecting);

  // Lock button visual
  const lockBtn    = document.getElementById('lockBtn');
  const lockIcon   = document.getElementById('lockIcon');
  const unlockIcon = document.getElementById('unlockIcon');
  const banner     = document.getElementById('unlockBanner');
  lockBtn.classList.toggle('unlocked', !isLocked);
  lockIcon.style.display   = isLocked   ? '' : 'none';
  unlockIcon.style.display = isLocked   ? 'none' : '';
  lockBtn.title    = isLocked ? 'Unlock to edit' : 'Lock (editing on)';
  banner.classList.toggle('visible', !isLocked);

  // Calc button visual
  document.getElementById('calcBtn').classList.toggle('selecting', isSelecting);

  // Update calc bar
  updateCalcBar();

  // Build lookup of entries by date
  const byDate = {};
  filtered.forEach(e => { byDate[e.date] = e; });

  // All days of current month
  const allDays = getDaysInMonth(currentYM);

  const list = document.getElementById('entryList');
  list.innerHTML = '';

  allDays.forEach((dateStr, i) => {
    const [,, day] = dateStr.split('-');
    const dateObj  = new Date(dateStr + 'T12:00:00');
    const wd       = WEEKDAYS[dateObj.getDay()];
    const isToday  = dateStr === today;
    const isPast   = dateStr < today;
    const isWeekend= dateObj.getDay() === 0 || dateObj.getDay() === 6;
    const entry    = byDate[dateStr];

    if (entry) {
      // ---- WORK DAY CARD ----
      const isSel = selectedIds.has(entry.id);
      const h = parseFloat(entry.hours) || 0;
      const r = parseFloat(entry.rate)  || 0;
      const earn = h * r;

      let earnHTML = '';
      if (h > 0 || r > 0) {
        earnHTML = '<div class="entry-earn">';
        if (h > 0) earnHTML += `<span class="earn-chip"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 3.5v2.5l1.5 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>${fmtHours(h)}</span>`;
        if (r > 0) earnHTML += `<span class="earn-chip">€${r.toFixed(2)}/h</span>`;
        if (h > 0 && r > 0) earnHTML += `<span class="earn-chip earn-total">${fmtEur(earn)}</span>`;
        earnHTML += '</div>';
      }

      let classes = 'entry-card';
      if (entry.completed) classes += ' completed';
      if (isToday)         classes += ' is-today';
      if (isSel)           classes += ' card-selected';
      if (isSelecting)     classes += ' selectable';
      else if (!isLocked)  classes += ' editable';

      const card = document.createElement('div');
      card.className = classes;
      card.setAttribute('role', 'listitem');
      card.style.animationDelay = (i * 0.02) + 's';
      card.dataset.id = entry.id;

      card.innerHTML = `
        <div class="date-bubble" aria-hidden="true">
          <span class="date-num">${parseInt(day, 10)}</span>
          <span class="date-wd">${wd}</span>
          <div class="select-tick">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3 7l3 3 5-5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="entry-body">
          <div class="entry-company">
            ${esc(entry.company)}${isToday ? '<span class="today-pill">Today</span>' : ''}
          </div>
          ${entry.role ? `<div class="entry-role">${esc(entry.role)}</div>` : ''}
          <div class="entry-meta">
            ${entry.address ? `
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true" style="flex-shrink:0">
                <path d="M6 1a3.5 3.5 0 0 0-3.5 3.5C2.5 7.5 6 11 6 11s3.5-3.5 3.5-6.5A3.5 3.5 0 0 0 6 1zm0 4.75a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z" fill="#3d5068"/>
              </svg>
              <span class="entry-address">${esc(entry.address)}</span>
            ` : (entry.notes ? `<span class="entry-address" style="font-style:italic">${esc(entry.notes)}</span>` : '')}
          </div>
          ${earnHTML}
        </div>
        <button class="check-btn"
                data-id="${entry.id}"
                aria-label="${entry.completed ? 'Mark incomplete' : 'Mark done'}">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <path d="M2.5 7.5l3.5 3.5 6.5-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      `;

      card.addEventListener('click', e => {
        if (e.target.closest('.check-btn')) return;
        if (isSelecting) { toggleCardSelect(entry.id); return; }
        if (!isLocked)   { openModal(entry.id); }
      });

      list.appendChild(card);

    } else {
      // ---- FREE DAY ----
      if (isSelecting) return; // hide free days in select mode

      let classes = 'free-day';
      if (isToday)   classes += ' is-today';
      if (isWeekend) classes += ' is-weekend';
      if (isPast)    classes += ' past';
      if (!isLocked) classes += ' clickable';

      const freeLabel = isToday ? 'Free - Today' : (isWeekend ? 'Weekend' : 'Free');

      const row = document.createElement('div');
      row.className = classes;
      row.setAttribute('role', 'listitem');
      row.style.animationDelay = (i * 0.02) + 's';
      row.dataset.date = dateStr;

      row.innerHTML = `
        <div class="date-bubble" aria-hidden="true">
          <span class="date-num">${parseInt(day, 10)}</span>
          <span class="date-wd">${wd}</span>
        </div>
        <div class="free-content">
          <span class="free-label">${freeLabel}</span>
          ${!isLocked ? '<span class="free-add-hint">+ Add shift</span>' : ''}
        </div>
      `;

      if (!isLocked) {
        row.addEventListener('click', () => openModalForDate(dateStr));
      }

      list.appendChild(row);
    }
  });

  // Check buttons - always active regardless of lock
  list.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      toggleDone(btn.dataset.id);
    });
  });
}

// ---- Update calc bar ----
function updateCalcBar() {
  const bar = document.getElementById('calcBar');
  bar.classList.toggle('open', isSelecting);

  if (!isSelecting) return;

  const all = load();
  const sel = all.filter(e => selectedIds.has(e.id));
  const selH = sel.reduce((s, e) => s + (parseFloat(e.hours) || 0), 0);
  const selE = sel.reduce((s, e) => s + entryEarnings(e), 0);

  const count = sel.length;
  document.getElementById('calcBarLabel').textContent =
    count === 0 ? 'Tap shifts to select' : count + (count === 1 ? ' shift selected' : ' shifts selected');
  document.getElementById('calcBarTotal').textContent = fmtEur(selE);
  document.getElementById('calcBarSub').textContent   = selH > 0 ? fmtHours(selH) + ' total' : 'No hours set';
}

// ---- Toggle done ----
function toggleDone(id) {
  const entries = load();
  const idx = entries.findIndex(e => e.id === id);
  if (idx !== -1) {
    entries[idx].completed = !entries[idx].completed;
    save(entries);
    render();
  }
}

// ---- Lock / Unlock ----
function toggleLock() {
  isLocked = !isLocked;
  if (isLocked && isSelecting) exitSelectMode();
  render();
}

// ---- Select mode ----
function enterSelectMode() {
  isSelecting = true;
  selectedIds.clear();
  render();
}

function exitSelectMode() {
  isSelecting = false;
  selectedIds.clear();
  render();
}

function toggleCardSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  // Re-render just the calc bar and card states efficiently
  // (full re-render is fine for this size)
  render();
}

// ---- Modal ----
const overlay = document.getElementById('overlay');

function openModal(id = null) {
  if (isLocked) return;
  editingId = id;
  const entries = load();
  const entry   = id ? entries.find(e => e.id === id) : null;

  document.getElementById('modalTitle').textContent = id ? 'Edit Shift' : 'Add Shift';
  document.getElementById('saveBtn').textContent    = id ? 'Save Changes' : 'Save Shift';
  document.getElementById('deleteRow').hidden       = !id;

  if (entry) {
    document.getElementById('fDate').value    = entry.date;
    document.getElementById('fCompany').value = entry.company;
    document.getElementById('fRole').value    = entry.role    || '';
    document.getElementById('fAddress').value = entry.address || '';
    document.getElementById('fHours').value   = entry.hours   || '';
    document.getElementById('fRate').value    = entry.rate    || '';
    document.getElementById('fNotes').value   = entry.notes   || '';
  } else {
    document.getElementById('shiftForm').reset();
    const todayVal = new Date().toISOString().slice(0, 7);
    document.getElementById('fDate').value =
      currentYM === todayVal ? todayStr() : currentYM + '-01';
  }

  updateEarnPreview();
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('fCompany').focus(), 360);
}

function openModalForDate(dateStr) {
  if (isLocked) return;
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add Shift';
  document.getElementById('saveBtn').textContent    = 'Save Shift';
  document.getElementById('deleteRow').hidden       = true;
  document.getElementById('shiftForm').reset();
  document.getElementById('fDate').value = dateStr;
  updateEarnPreview();
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('fCompany').focus(), 360);
}

function closeModal() {
  overlay.classList.remove('open');
  editingId = null;
}

function updateEarnPreview() {
  const h = parseFloat(document.getElementById('fHours').value) || 0;
  const r = parseFloat(document.getElementById('fRate').value)  || 0;
  const preview = document.getElementById('earnPreview');
  const val     = document.getElementById('earnPreviewVal');
  if (h > 0 && r > 0) {
    preview.style.display = '';
    val.textContent = fmtEur(h * r);
  } else {
    preview.style.display = 'none';
  }
}

// ---- Event listeners ----
document.getElementById('prevBtn').addEventListener('click', () => {
  currentYM = shiftYM(currentYM, -1);
  render();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  currentYM = shiftYM(currentYM, 1);
  render();
});

document.getElementById('lockBtn').addEventListener('click', toggleLock);

document.getElementById('calcBtn').addEventListener('click', () => {
  if (isSelecting) exitSelectMode();
  else enterSelectMode();
});

document.getElementById('calcCancelBtn').addEventListener('click', exitSelectMode);

document.getElementById('fabBtn').addEventListener('click', () => openModal());
document.getElementById('cancelBtn').addEventListener('click', closeModal);

overlay.addEventListener('click', e => {
  if (e.target === overlay) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (overlay.classList.contains('open')) closeModal();
    else if (isSelecting) exitSelectMode();
  }
});

document.getElementById('deleteBtn').addEventListener('click', () => {
  if (!editingId) return;
  const entries = load().filter(e => e.id !== editingId);
  save(entries);
  closeModal();
  render();
});

// Live earn preview while typing in modal
['fHours', 'fRate'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateEarnPreview);
});

document.getElementById('shiftForm').addEventListener('submit', e => {
  e.preventDefault();

  const date    = document.getElementById('fDate').value.trim();
  const company = document.getElementById('fCompany').value.trim();
  const role    = document.getElementById('fRole').value.trim();
  const address = document.getElementById('fAddress').value.trim();
  const hours   = document.getElementById('fHours').value.trim();
  const rate    = document.getElementById('fRate').value.trim();
  const notes   = document.getElementById('fNotes').value.trim();

  if (!date || !company || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  if (isNaN(new Date(date + 'T12:00:00').getTime())) return;

  const entries = load();

  if (editingId) {
    const idx = entries.findIndex(e => e.id === editingId);
    if (idx !== -1) {
      entries[idx] = { ...entries[idx], date, company, role, address, hours, rate, notes };
    }
  } else {
    entries.push({ id: uid(), date, company, role, address, hours, rate, notes, completed: false });
  }

  save(entries);
  const ym = date.slice(0, 7);
  if (/^\d{4}-\d{2}$/.test(ym)) currentYM = ym;
  closeModal();
  render();
});

// ---- Boot ----
render();

// ---- Service Worker ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
